<!DOCTYPE html>
{% load static %}
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Teacher Portal - Online Exam System</title>
</head>

<body>
  {% include "exam/navbar.html" %}

  <div class="public-page-wrapper">
    <div class="container my-auto py-5">
      <div class="jumbotron text-center shadow-lg" style="background: #ffffff; border-radius: 16px; border-top: 5px solid #0284c7; padding: 40px 20px;">
        <h1 class="display-4" style="font-weight: 800; color: #0f172a;">Hello Teacher,</h1>
        <p class="lead text-muted" style="font-size: 18px;">Welcome to the Online Examination System Management Portal</p>
        <hr class="my-4" style="max-width: 200px; border-top: 2px solid #0284c7;">
        <p style="font-size: 16px; color: #475569;">Select an option below to enter your portal</p>
        <div class="d-flex justify-content-center" style="gap: 15px; flex-wrap: wrap;">
          <a class="btn btn-info btn-lg px-4 py-3" style="border-radius: 30px; font-weight: bold;" href="teachersignup" role="button">
            <i class="fas fa-user-plus"></i> Create Teacher Account
          </a>
          <a class="btn btn-success btn-lg px-4 py-3" style="border-radius: 30px; font-weight: bold;" href="teacherlogin" role="button">
            <i class="fas fa-sign-in-alt"></i> Teacher Login
          </a>
        </div>
      </div>
    </div>
  </div>

  {% include "exam/footer.html" %}
</body>
</html>
