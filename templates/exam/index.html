<!DOCTYPE html>
{% load static %}
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Examination System</title>
  <style>
    .hero-section {
      background-image: url("{% static 'image/daffo.jpg' %}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: calc(100vh - 120px);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-section::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.7);
      z-index: 1;
    }

    .hero-container {
      position: relative;
      z-index: 2;
      color: white;
    }
  </style>
</head>

<body>
  {% include "exam/navbar.html" %}

  <div class="public-page-wrapper">
    <div class="hero-section">
      <div class="hero-container text-center px-3 py-5">
        <h1 class="display-3 text-info" style="font-weight: 800;">Online Examination System</h1>
        <p class="display-4 d-none d-sm-block text-light" style="font-size: 28px;">Attend your examinations online with AI Anti-Cheating Proctoring</p>
        <p class="lead text-light mb-4">Sign Up now to start your first online examination</p>

        <a href="/student/studentsignup" class="btn btn-lg btn-info px-4 py-3" style="border-radius: 30px; font-weight: bold;">
          <i class="fa fa-graduation-cap" aria-hidden="true"></i> Sign Up as Student
        </a>
      </div>
    </div>
  </div>

  {% include "exam/footer.html" %}
</body>

</html>
